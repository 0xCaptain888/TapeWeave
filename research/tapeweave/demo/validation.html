<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapeWeave 人工验收记录</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>人工验收记录 · 未认证</h1><p><a href="studio.html">打开工作室</a> · <a href="VALIDATION.md">完整验收步骤</a></p><p>本页仅整理你实际观察到的结果，不执行测试、不判定独立身份、不上传或自动保存。不要填姓名、联系方式或任何钱包秘密。刷新将丢失内容；提交前请复制保存。</p><p>手机任务：默认蓄能卡0011（等、等、触发、触发），预期训练2／门1剩1钥匙；另记录刷新和实际复制粘贴。独立玩家须先预测，再操作，普通模式同规则对照。没有执行或没有同意时，不得记为通过。</p>
<form id="record-form"><label>角色<select name="kind"><option value="author-mobile">作者实际手机</option><option value="independent-player">非作者玩家</option><option value="creator">创作者</option><option value="developer">开发者</option></select></label><label><input type="checkbox" name="consent">已取得非作者参与者同意（不记录其身份）</label><label>设备／系统／浏览器<input name="device" maxlength="300" required></label><label>执行模式<select name="mode"><option value="byte">字节</option><option value="plain">普通模式</option><option value="both">两者均实际体验</option></select></label><label>操作前预测<textarea name="prediction" maxlength="1200" required></textarea></label><label>实际动作及模式顺序<input name="actions" maxlength="300" required></label><label>实际结果（包括分数、资源、刷新、复制等）<textarea name="observed" maxlength="1200" required></textarea></label><label>所需帮助／失败／未完成项（没有则明确写无）<textarea name="help_and_failures" maxlength="1200" required></textarea></label><label>结果<select name="result" required><option value="">请选择，不默认通过</option><option value="pass">本次任务通过</option><option value="fail">失败</option><option value="incomplete">未完成</option></select></label><button type="submit">生成未认证记录</button></form><p id="status" role="status"></p><textarea id="output" readonly rows="14" aria-label="人工观察JSON"></textarea><button id="copy" disabled>复制记录</button><p>文字、勾选和角色都可以自报或伪造；本JSON不是独立采用证明、成绩认证或链回执。生成时间也不认证观察时间。失败记录应保留，不为比赛改成通过。</p><script type="module" src="validation-page.mjs"></script></main></body></html>
